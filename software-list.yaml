  其他工具:
    - name: Everything
      homepage: https://www.voidtools.com/
      url: https://www.voidtools.com/Everything-{ver}.x64.zip
      version_pattern: Everything-([\d.]+)\.x64\.zip
      note: 版本自动解析
    - name: Rufus
      homepage: https://rufus.ie/
      github: pbatard/rufus
      asset_pattern: ^rufus-.*\.exe$
      no_extract: true
      note: 单文件绿色工具
    - name: 7-Zip ZS
      homepage: https://github.com/mcmilk/7-Zip-zstd
      github: mcmilk/7-Zip-zstd
      asset_pattern: zstd-x64\.exe$
      note: zstd 增强版 7-Zip（作者 mcmilk），安装器经 7-Zip 提取后即绿色便携版
    - name: WinRAR
      homepage: https://www.rarlab.com/download.htm
      url: https://www.rarlab.com/rar/winrar-x64-{ver}.exe
      version_pattern: winrar-x64-([\d.]+)\.exe
      note: 官方安装器为 PE 内嵌 Rar5，自动解出绿色便携版；版本自动解析；RAR 格式标准（7-Zip 不写 RAR），用户指定保留
    - name: Dism++
      homepage: https://github.com/Chuyu-Team/Dism-Multi-language
      github: Chuyu-Team/Dism-Multi-language
      asset_pattern: Dism\+\+.*\.zip$
      note: 官方仓库已由 Dism-plus-plus 更名，从 Dism-Multi-language 的 Release 自动获取
    - name: BleachBit
      homepage: https://github.com/bleachbit/bleachbit
      github: bleachbit/bleachbit
      asset_pattern: -portable\.zip$
      note: 开源系统清理（浏览器缓存/日志/临时文件，GPL），绿色便携版
