# ============================================================
#  硬件工具箱软件清单 —— 自动下载脚本数据源
# ------------------------------------------------------------
#  下载方式优先级：
#   tpu      TechPowerUp 三步下载（自动取最新版 + 选镜像）
#   github   仓库名 + asset_pattern（自动查最新 Release）
#   mediafire MediaFire 页面解析直链
#   url      官网稳定直链（版本更新时手动改）
#   （无以上字段 = 需手动，见 note 说明原因）
#
#  注释约定：
#   # - name: XXX  表示该工具暂无官方/镜像可脚本化来源，已注释停用，
#   note 中会注明原因及替代品（替代品通常已在清单内或已另行收录）。
# ============================================================

categories:
  处理器工具:
    - name: CPU-Z
      homepage: https://www.cpuid.com/softwares/cpu-z.html
      url: https://download.cpuid.com/cpu-z/cpu-z_{ver}-cn.zip
      version_pattern: cpu-z[-_ ]?([\d.]+)
      note: 官方中文版，版本自动解析
