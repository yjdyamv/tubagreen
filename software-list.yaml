    - name: RWEverything
      version_url: http://rweverything.com/download/
      url: http://rweverything.com/downloads/RwPortableV{ver}.zip
      version_pattern: RwPortableV([\d.]+)\.zip
      note: 官方便携版（页面同时有 RwX64 版），版本自动解析

  外设工具:
