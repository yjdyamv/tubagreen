# ============================================================
#  图吧工具箱软件清单 —— 自动下载脚本数据源
# ------------------------------------------------------------
#  下载方式优先级：
#   tpu      TechPowerUp 三步下载（自动取最新版 + 选镜像）
#   github   仓库名 + asset_pattern（自动查最新 Release）
#   mediafire MediaFire 页面解析直链
#   url      官网稳定直链（版本更新时手动改）
#   （无以上字段 = 需手动，见 note 说明原因）
# ============================================================

categories:
  处理器工具:
    - name: CPU-Z
      homepage: https://www.cpuid.com/softwares/cpu-z.html
      url: https://download.cpuid.com/cpu-z/cpu-z_2.14-cn.zip
      note: 官方中文版
    - name: Core Temp
      homepage: https://www.alcpu.com/CoreTemp/
      url: https://www.alcpu.com/CoreTemp/Core-Temp-setup.exe
      note: Inno 安装器（用 innoextract 自动提取）
    - name: Prime95
      homepage: https://www.mersenne.org/download/
      url: https://www.mersenne.org/download/software/v30/30.19/p95v3019b15.win64.zip
    - name: ThrottleStop
      homepage: https://www.techpowerup.com/download/techpowerup-throttlestop/
      tpu: techpowerup-throttlestop
    - name: LinX
      homepage: ""
      note: 论坛软件无官方源，请从图吧工具箱内提取
    - name: wPrime
      homepage: ""
      note: 老软件官网已失效，请从图吧工具箱内提取
    - name: SuperPi
      homepage: ""
      note: 老软件无官网，请从图吧工具箱内提取

  显卡工具:
    - name: GPU-Z
      homepage: https://www.techpowerup.com/gpuz/
      tpu: techpowerup-gpu-z
      tpu_pattern: TechPowerUp GPU-Z
      no_extract: true
      note: 标准版（排除 ASUS ROG 等定制皮肤版），单文件绿色工具
    - name: FurMark
      homepage: https://geeks3d.com/furmark/
      url: https://www.geeks3d.com/dl/get/771
      note: FurMark 2.5.0 zip 版（绿色免安装）
    - name: DDU (Display Driver Uninstaller)
      homepage: https://www.wagnardsoft.com/display-driver-uninstaller-ddu
      note: 官网有反爬保护(Cloudflare)，需浏览器手动下载
    - name: dxvachecker
      homepage: ""
      note: 原作者页面已下线，请从图吧工具箱内提取
    - name: nvidiaInspector
      homepage: https://www.guru3d.com/download/nvidia-inspector/
      tpu: nvidia-inspector
    - name: nvidiaProfileInspector
      homepage: https://www.guru3d.com/download/nvidia-profile-inspector/
      tpu: nvidia-profile-inspector

  硬盘工具:
