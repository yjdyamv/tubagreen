  综合检测:
    - name: AIDA64 Business
      homepage: https://www.aida64.com/downloads
      url: https://download.aida64.com/aida64business720.zip
      post_fix_encoding: Language/lang_cn.txt
      note: 商业试用版（30 天，会过期）；信息+基准+烤机全能，功能强大
      homepage: https://github.com/LibreHardwareMonitor/LibreHardwareMonitor
      github: LibreHardwareMonitor/LibreHardwareMonitor
      asset_pattern: ^LibreHardwareMonitor\.zip$
      note: 开源硬件监控（Open Hardware Monitor 活跃分支，GPL），传感器/温度/电压/风扇监控，AIDA64 监控功能的开源替代
    - name: LatencyMon
      homepage: https://www.resplendence.com/latencymon
      url: https://www.resplendence.com/download/LatencyMon.exe
      version_pattern: LatencyMon v?\s*([\d.]+)
      no_extract: true
      note: DPC 延迟检测（音频爆音/驱动延迟诊断）；下载文件名固定，版本仅作更新提醒
    - name: HWiNFO
      homepage: https://www.hwinfo.com/download/
      ua: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36
      url: https://www.hwinfo.com/files/hwi_{ver}.zip
      version_pattern: hwi_(\d+)\.zip
      note: 版本自动解析；该站封 curl UA 需浏览器 UA
    # - name: HWMonitor
