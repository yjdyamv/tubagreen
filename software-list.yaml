      url: https://download.eassos.com/DGEng6201829_x64.zip
      note: 官网 x64 便携版
    - name: WizTree
      homepage: https://diskanalyzer.com/
      url: https://diskanalyzer.com/files/wiztree_4_21_portable.zip
      note: 官方便携版
    - name: WinDirStat
      homepage: https://windirstat.net/
      github_latest: windirstat/windirstat
