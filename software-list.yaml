      note: 标准版（排除 ASUS ROG 等定制皮肤版），单文件绿色工具
    - name: FurMark
      homepage: https://geeks3d.com/furmark/
      url: https://www.geeks3d.com/dl/get/830
      note: FurMark 2.10.2 zip 版（绿色免安装）；Geeks3D 的 dl ID 按版本固定，出新版时到 furmark/downloads 核对新 ID
    # - name: DDU (Display Driver Uninstaller)
