      homepage: https://github.com/pattazl/showKeyBoard
      github: pattazl/showKeyBoard
      asset_pattern: .*\.7z$
      note: 开源键盘测试工具（替代官网已失效的 Keyboard Test Utility），选 7z 便携版
    - name: MouseTester
      homepage: https://github.com/microe1/MouseTester
      github: microe1/MouseTester
