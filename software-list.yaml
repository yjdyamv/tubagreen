    #   note: 磁盘空间分析已被清单内 WizTree 覆盖，故停用
    - name: Ventoy
      homepage: https://www.ventoy.net/
      github: ventoy/Ventoy
      asset_pattern: ventoy-.*-windows\.zip$
    # - name: urwtest
    #   homepage: ""
    #   note: 作者未发布官方 Release；已被清单内 MediaTester 替代（同类 U 盘/SD 卡坏块与扩容检测）
    - name: MediaTester
      homepage: https://github.com/dkrahmer/MediaTester
      github: dkrahmer/MediaTester
      asset_pattern: MediaTester\.exe$
      no_extract: true
      note: urwtest/h2testw 同类工具（U 盘/SD 卡坏块与扩容检测），单文件绿色版
