  硬盘工具:
    - name: CrystalDiskInfo
      homepage: https://crystalmark.info/en/software/crystaldiskinfo/
      url: https://downloads.sourceforge.net/project/crystaldiskinfo/{ver}/CrystalDiskInfo{ver_nodot}.zip
      version_pattern: CrystalDiskInfo\s*([\d.]+)
      note: 版本自动解析（SourceForge 路径含版本号）
    - name: CrystalDiskMark
      homepage: https://crystalmark.info/en/software/crystaldiskmark/
      url: https://downloads.sourceforge.net/project/crystaldiskmark/{ver}/CrystalDiskMark{ver_nodot}.zip
      version_pattern: CrystalDiskMark\s*([\d.]+)
      note: 版本自动解析（SourceForge 路径含版本号）
    - name: DiskGenius
      homepage: https://www.diskgenius.com/professional.php
      url: https://download.eassos.com/DGEng6201829_x64.zip
      note: 官网 x64 便携版；分区管理神器（免费版功能完整）
    - name: WizTree
      homepage: https://diskanalyzer.com/
      version_url: https://diskanalyzer.com/download
      url: https://diskanalyzer.com/files/wiztree_{ver}_portable.zip
      version_pattern: wiztree_([\d_]+)_portable\.zip
      note: 官方便携版，版本自动解析
